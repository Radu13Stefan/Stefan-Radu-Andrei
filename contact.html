<!doctype html>
<html lang="en" id="top">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — Crux Supply</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    main h1{text-align:center;color:var(--brown-700);font-size:clamp(1.6rem,2.2vw + 1rem,2.4rem);margin-bottom:28px}
    form{background:var(--card);border:1px solid rgba(0,0,0,.06);border-radius:var(--radius);box-shadow:0 1px 0 rgba(0,0,0,.03);padding:28px;display:flex;flex-direction:column;gap:14px;margin-bottom:40px}
    input[type="text"],input[type="email"],textarea{width:100%;padding:12px 14px;border:1px solid rgba(0,0,0,.15);border-radius:10px;background:#fff;outline:none;font-size:1rem;transition:border-color .15s ease,box-shadow .15s ease}
    textarea{min-height:120px;resize:vertical}
    input:focus,textarea:focus{border-color:var(--green-600);box-shadow:0 0 0 3px rgba(46,125,50,.15)}
    button[type="submit"]{padding:12px 16px;border:0;border-radius:10px;background:var(--green-700);color:#fff;font-weight:600;cursor:pointer;font-size:1rem;transition:background .15s ease,transform .15s ease}
    button[type="submit"]:hover{background:var(--green-600);transform:translateY(-1px)}
    main h2{color:var(--green-700);font-size:1.3rem;margin:0 0 16px;text-align:center}
    iframe{border-radius:var(--radius);border:1px solid rgba(0,0,0,.06);box-shadow:0 2px 8px rgba(46,125,50,.08)}
    @media(max-width:900px){form{padding:20px}}
  </style>
</head>
<body>
  <div class="site">
    <header>
      <div class="header-bar">
        <div class="navbar">
          <a class="brand" href="index.html">Crux Supply</a>
          <div class="nav-actions">
            <button onclick="location.href='index.html#search'">Search</button>
            <button onclick="location.href='account.html'">Account</button>
            <button onclick="location.href='cart.html'">Cart</button>
          </div>
        </div>
      </div>
    </header>

    <nav class="side-nav">
      <h3>Shop</h3>
      <a href="index.html#new">New</a>
      <a href="index.html#shoes">Shoes</a>
      <a href="index.html#chalk">Chalk</a>
      <a href="index.html#chalkbags">Chalk Bags</a>
      <a href="index.html#skin">Skin Care</a>
      <a href="index.html#pads">Crash Pads</a>
      <a href="index.html#training">Training</a>
      <a href="faq.html">Shipping & Returns</a>
      <a href="about.html">About</a>
    </nav>

    <main>
      <div class="main-card">
        <h1>Contact Us</h1>
        <form>
          <input type="text" placeholder="Your Name" required>
          <input type="email" placeholder="Email" required>
          <textarea placeholder="Message" required></textarea>
          <button type="submit">Send</button>
        </form>
        <h2>Find Us</h2>
        <iframe src="" width="100%" height="300" style="border:0;" loading="lazy" title="Map"></iframe>
      </div>
    </main>

    <aside class="aside-card">
      <h3>Contact Info</h3>
      <p>Email: hello@cruxsupply.com</p>
      <p>Phone: +1 (555) 123-4567</p>
      <p>Address: 42 Boulder Ave, Denver, CO</p>
    </aside>

    <footer>
      <p>© <span id="y"></span> Crux Supply.</p>
      <nav>
        <a href="faq.html">Shipping & Returns</a>
        <a href="about.html">About</a>
      </nav>
    </footer>
  </div>

  <a class="back-to-top" href="#top" aria-label="Back to top">↑</a>

  <script>document.getElementById('y').textContent=new Date().getFullYear()</script>
</body>
</html>
